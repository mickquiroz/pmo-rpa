<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PMO RPA Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Frappe Gantt CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-light">

<!-- Navbar -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">PMO RPA Dashboard</a>
        <div class="d-flex align-items-center">
            <label for="role-select" class="text-white me-2 mb-0 fw-semibold">Ver como:</label>
            <select id="role-select" class="form-select form-select-sm w-auto">
                <option value="Admin">Admin</option>
                <option value="PMO" selected>PMO</option>
                <option value="Developer">Developer</option>
            </select>
        </div>
    </div>
</nav>

<!-- Main Container -->
<div class="container mt-4">
    <!-- Error Alert Container -->
    <div id="error-container"></div>

    <div class="card shadow-sm border-0">
        <div class="card-header bg-white border-bottom-0 pt-4 pb-0 d-flex justify-content-between align-items-center">
            <h5 class="card-title fw-bold text-dark mb-0">Resumen de Proyectos</h5>
            <div>
                <button id="btn-create-project" class="btn btn-primary me-2" data-bs-toggle="modal" data-bs-target="#createProjectModal" style="display: none;">Crear Proyecto</button>
                <button id="btn-export" class="btn btn-success">Descargar Reporte</button>
            </div>
        </div>
        <div class="card-body">
            <div class="table-responsive">
                <table class="table table-hover align-middle">
                    <thead class="table-light">
                        <tr>
                            <th>Proceso</th>
                            <th>Desarrollador</th>
                            <th>Estado de Salud</th>
                            <th class="w-25">Avance General</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="projects-table-body">
                        <!-- Projects injected dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<!-- Gantt Modal -->
<div class="modal fade" id="ganttModal" tabindex="-1" aria-labelledby="ganttModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="ganttModalLabel">Project Gantt Chart</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body overflow-auto">
                <div id="gantt-target"></div>
            </div>
        </div>
    </div>
</div>

<!-- Create Project Modal -->
<div class="modal fade" id="createProjectModal" tabindex="-1" aria-labelledby="createProjectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="createProjectModalLabel">Crear Nuevo Proyecto</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <form id="create-project-form">
                    <div class="mb-3">
                        <label for="process-name" class="form-label">Nombre del Proceso</label>
                        <input type="text" class="form-control" id="process-name" required>
                    </div>
                    <div class="mb-3">
                        <label for="assigned-developer" class="form-label">Desarrollador Asignado</label>
                        <select class="form-select" id="assigned-developer" required>
                            <!-- ID asumiendo la semilla del backend -->
                            <option value="3">Developer User (ID: 3)</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label for="start-date" class="form-label">Fecha de Inicio</label>
                        <input type="date" class="form-control" id="start-date" required>
                    </div>
                    <div class="mb-3">
                        <label for="estimated-end-date" class="form-label">Fecha Estimada de Fin</label>
                        <input type="date" class="form-control" id="estimated-end-date" required>
                    </div>
                    <div class="text-end mt-4">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar Proyecto</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

<!-- Manage Phases Modal -->
<div class="modal fade" id="managePhasesModal" tabindex="-1" aria-labelledby="managePhasesModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-xl">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title fw-bold" id="managePhasesModalLabel">Administrar Fases</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle">
                        <thead class="table-light">
                            <tr>
                                <th>Fase</th>
                                <th>Fecha Inicio</th>
                                <th>Fecha Fin</th>
                                <th>Estado</th>
                                <th>Acciones</th>
                            </tr>
                        </thead>
                        <tbody id="phases-table-body">
                            <!-- Phases injected dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cerrar</button>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap 5 JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<!-- Frappe Gantt JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/frappe-gantt/0.6.1/frappe-gantt.min.js"></script>
<!-- Custom JS -->
<script src="app.js"></script>
</body>
</html>
